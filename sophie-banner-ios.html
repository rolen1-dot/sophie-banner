<style>
:root{
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol";
  --ui:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;
  --accent:#ff2d55; --accent2:#ff5c8a;
  --sheet:rgba(242,242,247,.94); --card:#fff; --label:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.2); --segsel:#fff; --hud:rgba(30,30,30,.72);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --accent:#ff375f; --sheet:rgba(28,28,30,.93); --card:rgba(44,44,46,.92); --label:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36); --segsel:#636366; --hud:rgba(60,60,64,.8);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#ff7bac;touch-action:manipulation}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;height:-webkit-fill-available;font-family:var(--ui);color:var(--label);
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
@supports (height:100dvh){body{height:100dvh}}
button,input,label,select{touch-action:manipulation;font-family:inherit}
button{-webkit-appearance:none;appearance:none}

/* ===== Banner ===== */
.bn{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;contain:strict}
.bgl{position:absolute;top:0;left:0;right:0;bottom:0;background:#ff7bac}
.bgl img{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;-webkit-filter:blur(28px) saturate(1.2);filter:blur(28px) saturate(1.2);display:none}
.bgl .dim{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;opacity:0}
.rot{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.dots{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none}
.fxc{position:absolute;left:0;top:0;pointer-events:none}
.mv{position:absolute;left:0;top:0;will-change:transform}
.anim{transform-origin:50% 50%}
.anim.pulse{-webkit-animation:pulse 1.8s ease-in-out infinite;animation:pulse 1.8s ease-in-out infinite}
.anim.flash1{-webkit-animation:flash 1.4s steps(1,end) infinite;animation:flash 1.4s steps(1,end) infinite}
.anim.flash2{-webkit-animation:flash .8s steps(1,end) infinite;animation:flash .8s steps(1,end) infinite}
.anim.pulse.flash1,.anim.pulse.flash2{-webkit-animation-name:pulse,flash;animation-name:pulse,flash}
@-webkit-keyframes pulse{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.045)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@-webkit-keyframes flash{0%{opacity:1}50%{opacity:.12}}
@keyframes flash{0%{opacity:1}50%{opacity:.12}}
.lay{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:.22em;white-space:pre;font-size:100px}
.lay.p-right{-webkit-flex-direction:row-reverse;flex-direction:row-reverse}
.lay.p-above{-webkit-flex-direction:column;flex-direction:column;gap:.14em}
.ph{position:relative;flex:none;overflow:hidden;border-style:solid;border-color:#fff;box-shadow:0 .03em .1em rgba(60,0,40,.28);background:#fff;-webkit-transform:translateZ(0)}
.ph.circle{border-radius:50%}.ph.rounded{border-radius:22%}.ph.none{border-radius:.06em}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;image-orientation:from-image;pointer-events:none;-webkit-user-drag:none}
.lines{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
.ln{line-height:1.12;white-space:pre;text-align:center}
.ln .e{font-family:var(--emoji)!important;font-weight:400;-webkit-text-fill-color:initial}
.ln .t.g{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-repeat:repeat-x}
.ln .t.g.sh{background-size:200% 100%;-webkit-animation:shim 3s linear infinite;animation:shim 3s linear infinite}
@-webkit-keyframes shim{to{background-position:200% 0}}
@keyframes shim{to{background-position:200% 0}}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;cursor:pointer}

/* ===== HUD / toast ===== */
.hud{position:fixed;left:50%;z-index:60;-webkit-transform:translate(-50%,-8px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:var(--hud);color:#fff;-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  padding:11px 18px;border-radius:16px;font-size:15px;font-weight:600;line-height:1.35;text-align:center;max-width:min(92vw,440px);
  transition:opacity .3s,transform .45s cubic-bezier(.32,.72,0,1)}
.hud.show{opacity:1;-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
#toast{top:calc(10px + var(--sat))}
#tapHint{bottom:calc(14px + var(--sab));border-radius:999px}
#lockRing{position:fixed;z-index:70;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;display:none}
#lockRing circle{fill:rgba(0,0,0,.35);stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:226;transform:rotate(-90deg);transform-origin:50% 50%}
#lockRing.go circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
#lockRing text{fill:#fff;font-size:26px;text-anchor:middle;dominant-baseline:central}

/* ===== Sheet ===== */
#scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .35s;z-index:9}
body.open #scrim{opacity:1}
#sheet{position:fixed;z-index:10;left:50%;width:100%;max-width:640px;top:calc(var(--sat) + 20px);bottom:0;
  -webkit-transform:translate(-50%,105%);transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.32,.72,0,1);
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);
  border-radius:14px 14px 0 0;box-shadow:0 -1px 0 rgba(255,255,255,.25) inset,0 -8px 40px rgba(0,0,0,.22);
  display:grid;grid-template-columns:100%;grid-template-rows:auto auto auto auto 1fr auto;
  grid-template-areas:"grab" "hdr" "pv" "tabs" "scroll" "foot";overflow:hidden;cursor:default}
body.open #sheet{-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
#sheet.drag{transition:none}
.grab{grid-area:grab;height:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--ter)}
.hdr{grid-area:hdr;display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;touch-action:none}
.hdr h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center;flex:1;white-space:nowrap}
.hbtn{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 0;min-width:64px;cursor:pointer}
.hbtn.l{text-align:left}.hbtn.r{text-align:right;font-weight:600}
.pvw{grid-area:pv;padding:0 16px 12px}
.pv{position:relative;width:100%;height:min(25vh,calc((min(100vw,640px) - 32px) * .5));min-height:120px;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.14);-webkit-transform:translateZ(0);touch-action:none}
.pv .ph{cursor:grab}
.tabs{grid-area:tabs;padding:0 16px 10px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative;gap:0}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--label);font-size:13px;font-weight:500;height:30px;border-radius:7px;
  padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative;transition:background .2s,box-shadow .2s}
.seg button+button::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--sep)}
.seg button.on::before,.seg button.on+button::before{opacity:0}
.seg button.on{background:var(--segsel);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.tabs .seg button{height:32px;font-size:13px}
.scroll{grid-area:scroll;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 24px;min-height:0}
.foot{grid-area:foot;padding:10px 16px calc(10px + var(--sab));border-top:.5px solid var(--sep)}
.showb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 6px 18px rgba(255,45,85,.32);transition:transform .18s cubic-bezier(.32,.72,0,1),opacity .2s}
.showb:active{transform:scale(.97);opacity:.9}
.ghdr{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:-.005em;padding:22px 32px 7px;margin:0;font-weight:400}
.ghdr:first-child{padding-top:6px}
.gfoot{font-size:13px;color:var(--sec);padding:7px 32px 0;line-height:1.35}
.group{background:var(--card);border-radius:10px;margin:0 16px;overflow:hidden}
