<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sophie's Banner</title>
<meta name="description" content="Fan banner for Sophie's kindergarten graduation">
<meta name="theme-color" content="#ff7bac">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sophie Banner">
<meta name="application-name" content="Sophie Banner">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol";
  --ui:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;
  --accent:#ff2d55; --accent2:#ff5c8a;
  --sheet:rgba(242,242,247,.94); --card:#fff; --label:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.2); --segsel:#fff; --hud:rgba(30,30,30,.72);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --accent:#ff375f; --sheet:rgba(28,28,30,.93); --card:rgba(44,44,46,.92); --label:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36); --segsel:#636366; --hud:rgba(60,60,64,.8);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#ff7bac;touch-action:manipulation}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;height:-webkit-fill-available;font-family:var(--ui);color:var(--label);
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
@supports (height:100dvh){body{height:100dvh}}
button,input,label,select{touch-action:manipulation;font-family:inherit}
button{-webkit-appearance:none;appearance:none}

/* ===== Banner ===== */
.bn{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;contain:strict}
.bgl{position:absolute;top:0;left:0;right:0;bottom:0;background:#ff7bac}
.bgl img{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;-webkit-filter:blur(28px) saturate(1.2);filter:blur(28px) saturate(1.2);display:none}
.bgl .dim{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;opacity:0}
.rot{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.dots{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none}
.fxc{position:absolute;left:0;top:0;pointer-events:none}
.mv{position:absolute;left:0;top:0;will-change:transform}
.anim{transform-origin:50% 50%}
.anim.pulse{-webkit-animation:pulse 1.8s ease-in-out infinite;animation:pulse 1.8s ease-in-out infinite}
.anim.flash1{-webkit-animation:flash 1.4s steps(1,end) infinite;animation:flash 1.4s steps(1,end) infinite}
.anim.flash2{-webkit-animation:flash .8s steps(1,end) infinite;animation:flash .8s steps(1,end) infinite}
.anim.pulse.flash1,.anim.pulse.flash2{-webkit-animation-name:pulse,flash;animation-name:pulse,flash}
@-webkit-keyframes pulse{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.045)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@-webkit-keyframes flash{0%{opacity:1}50%{opacity:.12}}
@keyframes flash{0%{opacity:1}50%{opacity:.12}}
.lay{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:.22em;white-space:pre;font-size:100px}
.lay.p-right{-webkit-flex-direction:row-reverse;flex-direction:row-reverse}
.lay.p-above{-webkit-flex-direction:column;flex-direction:column;gap:.14em}
.ph{position:relative;flex:none;overflow:hidden;border-style:solid;border-color:#fff;box-shadow:0 .03em .1em rgba(60,0,40,.28);background:#fff;-webkit-transform:translateZ(0)}
.ph.circle{border-radius:50%}.ph.rounded{border-radius:22%}.ph.none{border-radius:.06em}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;image-orientation:from-image;pointer-events:none;-webkit-user-drag:none}
.lines{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
.ln{line-height:1.12;white-space:pre;text-align:center}
.ln .e{font-family:var(--emoji)!important;font-weight:400;-webkit-text-fill-color:initial}
.ln .t.g{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-repeat:repeat-x}
.ln .t.g.sh{background-size:200% 100%;-webkit-animation:shim 3s linear infinite;animation:shim 3s linear infinite}
@-webkit-keyframes shim{to{background-position:200% 0}}
@keyframes shim{to{background-position:200% 0}}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;cursor:pointer}

/* ===== HUD / toast ===== */
.hud{position:fixed;left:50%;z-index:60;-webkit-transform:translate(-50%,-8px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:var(--hud);color:#fff;-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  padding:11px 18px;border-radius:16px;font-size:15px;font-weight:600;line-height:1.35;text-align:center;max-width:min(92vw,440px);
  transition:opacity .3s,transform .45s cubic-bezier(.32,.72,0,1)}
.hud.show{opacity:1;-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
#toast{top:calc(10px + var(--sat))}
#tapHint{bottom:calc(14px + var(--sab));border-radius:999px}
#lockRing{position:fixed;z-index:70;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;display:none}
#lockRing circle{fill:rgba(0,0,0,.35);stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:226;transform:rotate(-90deg);transform-origin:50% 50%}
#lockRing.go circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
#lockRing text{fill:#fff;font-size:26px;text-anchor:middle;dominant-baseline:central}

/* ===== Sheet ===== */
#scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .35s;z-index:9}
body.open #scrim{opacity:1}
#sheet{position:fixed;z-index:10;left:50%;width:100%;max-width:640px;top:calc(var(--sat) + 20px);bottom:0;
  -webkit-transform:translate(-50%,105%);transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.32,.72,0,1);
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);
  border-radius:14px 14px 0 0;box-shadow:0 -1px 0 rgba(255,255,255,.25) inset,0 -8px 40px rgba(0,0,0,.22);
  display:grid;grid-template-columns:100%;grid-template-rows:auto auto auto auto 1fr auto;
  grid-template-areas:"grab" "hdr" "pv" "tabs" "scroll" "foot";overflow:hidden;cursor:default}
body.open #sheet{-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
#sheet.drag{transition:none}
.grab{grid-area:grab;height:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--ter)}
.hdr{grid-area:hdr;display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;touch-action:none}
.hdr h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center;flex:1;white-space:nowrap}
.hbtn{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 0;min-width:64px;cursor:pointer}
.hbtn.l{text-align:left}.hbtn.r{text-align:right;font-weight:600}
.pvw{grid-area:pv;padding:0 16px 12px}
.pv{position:relative;width:100%;height:min(25vh,calc((min(100vw,640px) - 32px) * .5));min-height:120px;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.14);-webkit-transform:translateZ(0);touch-action:none}
.pv .ph{cursor:grab}
.tabs{grid-area:tabs;padding:0 16px 10px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative;gap:0}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--label);font-size:13px;font-weight:500;height:30px;border-radius:7px;
  padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative;transition:background .2s,box-shadow .2s}
.seg button+button::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--sep)}
.seg button.on::before,.seg button.on+button::before{opacity:0}
.seg button.on{background:var(--segsel);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.tabs .seg button{height:32px;font-size:13px}
.scroll{grid-area:scroll;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 24px;min-height:0}
.foot{grid-area:foot;padding:10px 16px calc(10px + var(--sab));border-top:.5px solid var(--sep)}
.showb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 6px 18px rgba(255,45,85,.32);transition:transform .18s cubic-bezier(.32,.72,0,1),opacity .2s}
.showb:active{transform:scale(.97);opacity:.9}
.ghdr{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:-.005em;padding:22px 32px 7px;margin:0;font-weight:400}
.ghdr:first-child{padding-top:6px}
.gfoot{font-size:13px;color:var(--sec);padding:7px 32px 0;line-height:1.35}
.group{background:var(--card);border-radius:10px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;position:relative;font-size:17px;letter-spacing:-.02em}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row .lbl{flex:1;min-width:0}
.row .val{color:var(--sec);font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-size:15px}
.row.col{flex-direction:column;align-items:stretch;gap:8px;padding:10px 16px}
.row.col .top{display:flex;justify-content:space-between;align-items:center}
.row.tap{cursor:pointer}.row.tap:active{background:var(--fill)}
.row .chk{color:var(--accent);font-weight:600;font-size:17px;width:20px;text-align:center}
.row .ico{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.tin{flex:1;min-width:0;border:0;background:transparent;font-size:17px;color:var(--label);outline:none;padding:8px 0;-webkit-user-select:text;user-select:text;letter-spacing:-.02em}
.tin::placeholder{color:var(--ter)}
.clr{border:0;background:var(--fill);color:var(--sec);width:22px;height:22px;border-radius:50%;font-size:12px;line-height:22px;padding:0;cursor:pointer;flex:none}
/* switch */
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;margin:0;flex:none;cursor:pointer;
  transition:background .25s;outline:none}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sw:checked{background:#34c759}
.sw:checked::before{transform:translateX(20px)}
/* slider */
.sl{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;outline:none;--p:50%;cursor:pointer}
.sl::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),var(--fill2) var(--p))}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;
  box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.sl::-moz-range-track{height:4px;border-radius:2px;background:var(--fill2)}
.sl::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.sl::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.slrow{display:flex;align-items:center;gap:10px}
.slrow .mi{font-size:13px;color:var(--sec);width:18px;text-align:center}
/* swatches */
.sws{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sws::-webkit-scrollbar{display:none}
.swc{flex:none;width:32px;height:32px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.swc.on::after{content:"";position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;border-radius:50%;border:2.5px solid var(--accent)}
.swc.big{width:58px;height:38px;border-radius:10px}.swc.big.on::after{border-radius:13px}
.cpick{flex:none;width:32px;height:32px;border-radius:50%;position:relative;overflow:hidden;cursor:pointer;
  background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.cpick::after{content:"";position:absolute;top:7px;left:7px;right:7px;bottom:7px;border-radius:50%;background:var(--cc,#fff);box-shadow:0 0 0 2px #fff}
.cpick input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--fill);color:var(--label);border-radius:999px;padding:7px 12px;font-size:15px;cursor:pointer;letter-spacing:-.01em}
.chip:active{background:var(--fill2)}
.btn{border:0;background:var(--fill);color:var(--accent);border-radius:10px;height:44px;font-size:17px;font-weight:500;cursor:pointer;flex:1;letter-spacing:-.02em}
.btn:active{opacity:.6}.btn.danger{color:#ff3b30}.btn.fill{background:var(--accent);color:#fff}
.btns{display:flex;gap:10px;padding:0 16px;margin-top:12px}
.addph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:150px;margin:0 16px;border-radius:14px;
  border:2px dashed var(--ter);color:var(--accent);font-size:17px;font-weight:600;cursor:pointer;position:relative}
.addph .big{font-size:40px}
.addph input,.fileBtn input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.fileBtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px}
.dcard{border:0;padding:0;background:transparent;text-align:left;cursor:pointer;color:var(--label);position:relative}
.dcard canvas{width:100%;aspect-ratio:16/9;border-radius:10px;display:block;background:var(--fill);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 3px 10px rgba(0,0,0,.1)}
.dcard span{display:block;font-size:13px;font-weight:500;padding:6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard:active{transform:scale(.97)}
.dcard .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:rgba(60,60,67,.75);color:#fff;font-size:14px;
  line-height:24px;text-align:center;border:2px solid var(--card)}
.fontrow .smp{font-size:22px;line-height:1;flex:1}
.pane{display:none;animation:fade .35s ease}.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* export modal */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal))}
#modal.on{display:flex}
.mbox{background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:16px;padding:16px;max-width:560px;width:100%;
  max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mbox img{width:100%;border-radius:10px;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.mbox p{font-size:13px;color:var(--sec);text-align:center;margin:10px 0 0}
.mbox .btns{padding:0}

/* landscape phone: side-by-side sheet */
@media (orientation:landscape) and (max-height:540px){
  #sheet{max-width:none;width:calc(100% - 24px);top:max(8px,var(--sat));border-radius:14px 14px 0 0;
    grid-template-columns:minmax(260px,40%) 1fr;grid-template-rows:auto auto 1fr auto;
    grid-template-areas:"hdr hdr" "pv tabs" "pv scroll" "foot scroll";padding-left:var(--sal);padding-right:var(--sar)}
  .grab{display:none}.hdr{padding-top:8px}
  .pvw{padding:0 8px 0 16px;display:flex;flex-direction:column;justify-content:center}.pv{height:auto;aspect-ratio:16/10;min-height:0;max-height:100%}
  .foot{border-top:0;padding:10px 8px calc(8px + var(--sab)) 16px}
  .tabs{padding-left:8px}.scroll .group{margin-left:8px}.scroll .ghdr,.scroll .gfoot{padding-left:24px}.scroll .btns,.scroll .cards{padding-left:8px}
  .scroll .addph{margin-left:8px}
}
</style>
</head>
<body class="open">
<div id="stage" aria-label="Banner. Tap to show or hide controls."></div>
<div id="scrim"></div>

<div id="sheet" role="dialog" aria-label="Banner settings">
  <div class="grab" id="grab"><i></i></div>
  <div class="hdr" id="hdr"><button class="hbtn l" id="exportBtn">Export</button><h1>Sophie's Banner</h1><button class="hbtn r" id="doneBtn">Done</button></div>
  <div class="pvw"><div class="pv" id="pv"></div></div>
  <div class="tabs"><div class="seg" id="tabs"></div></div>
  <div class="scroll" id="scroll"></div>
  <div class="foot"><button class="showb" id="showBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg>Show Banner</button></div>
</div>

<div id="toast" class="hud"></div>
<div id="tapHint" class="hud">Tap anywhere for controls</div>
<svg id="lockRing" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36"/><text x="42" y="43">🔓</text></svg>
<div id="modal"><div class="mbox"><img id="mimg" alt="Banner image"><p id="mtip">Press and hold the image to save it to Photos.</p>
  <div class="btns" style="margin-top:12px"><button class="btn" id="mshare">Share…</button><a class="btn" id="mdl" download="sophie-banner.png" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Download</a><button class="btn fill" id="mclose">Done</button></div></div></div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];
  if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k==="style")e.style.cssText=v;else if(k==="cls")e.className=v;
  else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}
  if(kids)kids.forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e;}
function clone(o){return JSON.parse(JSON.stringify(o))}
function tick(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}

/* ================= Data ================= */
var EMO="var(--emoji)";
var FONTS=[
 ["rounded","SF Pro Rounded",'ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,-apple-system,sans-serif'],
 ["system","SF Pro",'system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Roboto,Arial,sans-serif'],
 ["serif","New York",'ui-serif,"New York","Iowan Old Style","Palatino",Georgia,"Noto Serif",serif'],
 ["marker","Marker",'"Marker Felt","Chalkboard SE","Bradley Hand","Segoe Print","Comic Sans MS","Comic Neue",cursive'],
 ["geo","Avenir",'"Avenir Next","Avenir","Futura","Century Gothic","Montserrat","Trebuchet MS",sans-serif'],
 ["mono","LED Mono",'ui-monospace,"SF Mono",Menlo,"Courier New","DejaVu Sans Mono",monospace']];
var EMOJI_STACK='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol"';
function fontStack(id){for(var i=0;i<FONTS.length;i++)if(FONTS[i][0]===id)return FONTS[i][2]+","+EMOJI_STACK;return FONTS[0][2]+","+EMOJI_STACK;}

  .catch(function(){return toDataURL(blob).then(function(u){try{if(u){localStorage.setItem("sbPhoto."+id,u);return true}}catch(e){}return false})});}

  r.onsuccess=function(){var v=r.result;res(v?(v instanceof Blob?v:new Blob([v.buf],{type:v.type})):fromLS())};r.onerror=function(){res(fromLS())}})}).catch(function(){return fromLS()});}

    return loadImg(u).then(function(i){photo={id:id,url:u,img:i};return true;});}).catch(function(){return false});}
function importPhoto(file){
  if(!file)return;toast("Preparing photo…",1200);
  var u=URL.createObjectURL(file);
  /* <img> decoding applies EXIF orientation (image-orientation:from-image is the default in iOS 13.4+/Chrome 81+) */
  loadImg(u).then(function(img){
    var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,1024/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    var x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    return new Promise(function(res){if(c.toBlob)c.toBlob(function(b){res({b:b,ar:c.width/c.height})},"image/jpeg",0.88);else res(null)});
  }).then(function(r){if(!r||!r.b)throw 0;var id="p"+Date.now();return idbPut(id,r.b).then(function(){
    S.photo.id=id;S.photo.ar=r.ar;S.photo.zoom=1;S.photo.px=0;S.photo.py=0;return usePhoto(id);});
  }).then(function(){gcPhotos();commit();buildPane();toast("Photo added 📸");}).catch(function(){URL.revokeObjectURL(u);toast("Sorry, that photo couldn't be opened");});
}

    if(r)r.onsuccess=function(){(r.result||[]).forEach(function(k){if(!keep[k])idbDel(k)})};}).catch(function(){});}

/* ================= Particles ================= */
var R=Math.random;function pick(a){return a[(R()*a.length)|0]}
var CCOL=["#ff4fa3","#ffd400","#4ade80","#38bdf8","#a855f7","#ff7a00","#ffffff","#e8467f"];
var HCOL=["#ff2d55","#ff4f93","#ff8fc1","#e0115f","#ffffff"];
var BCOL=["#ff4f93","#ffcc00","#34c759","#30b0c7","#af52de","#ff9500","#007aff"];
function mkConf(W,H,any){return{x:R()*W,y:any?R()*H:-20,w:6+R()*8,h:10+R()*10,vy:H*(0.05+R()*0.08),vx:(R()-0.5)*30,a:R()*6.28,va:(R()-0.5)*6,c:pick(CCOL)}}

function drawSpark(x,s,a){var r=s.r*(0.55+0.45*a),cx=s.x,cy=s.y;x.globalAlpha=Math.max(0,a);x.fillStyle=s.c;x.beginPath();x.moveTo(cx,cy-r);
  x.quadraticCurveTo(cx,cy,cx+r*0.8,cy);x.quadraticCurveTo(cx,cy,cx,cy+r);x.quadraticCurveTo(cx,cy,cx-r*0.8,cy);x.quadraticCurveTo(cx,cy,cx,cy-r);x.fill();x.globalAlpha=1;}

  x.quadraticCurveTo(cx+Math.sin(t*0.002+b.p)*r*0.4,cy+r*1.8,cx,cy+r*2.8);x.stroke();

  x.fillStyle="rgba(255,255,255,.35)";x.beginPath();x.ellipse(cx-r*0.32,cy-r*0.38,r*0.16,r*0.28,-0.5,0,6.2832);x.fill();}
var P={c:[],s:[],h:[],b:[]};
function initP(W,H){P={c:[],s:[],h:[],b:[]};var a=W*H;
  for(var i=0;i<Math.round(Math.min(90,a/6000));i++)P.c.push(mkConf(W,H,true));
  for(i=0;i<Math.round(Math.min(26,a/18000));i++)P.s.push(mkSpark(W,H));
  for(i=0;i<Math.round(Math.min(22,a/22000));i++)P.h.push(mkHeart(W,H,true));
  for(i=0;i<Math.round(Math.min(12,a/40000));i++)P.b.push(mkBall(W,H,true));}
function drawFx(b,d,dt,t){if(!b.fx)return;var x=b.fx.getContext("2d"),W=b.W,H=b.H,i;x.clearRect(0,0,W,H);
  if(d.fx.balloons)for(i=0;i<P.b.length;i++){var o=P.b[i];o.y-=o.vy*dt;o.x+=Math.sin(t*0.001+o.p)*0.3;if(o.y<-o.r*3.5)P.b[i]=o=mkBall(W,H,false);drawBall(x,o,t);}

    if(c.y>H+20)P.c[i]=c=mkConf(W,H,false);drawConf(x,c);}x.globalAlpha=1;}
